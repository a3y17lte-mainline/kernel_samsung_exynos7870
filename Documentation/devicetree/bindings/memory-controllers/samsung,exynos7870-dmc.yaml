%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/samsung,exynos7870-dmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7870 DRAM controller frequency scaling

maintainers:
  - Martin Štrobl <recordyletsplays@gmail.com>

description:
  The DRAM controller (DREX) of the Exynos7870 and its PHY run from MEM_PLL.
  To change the memory frequency, the PHY clock is moved to a switching clock
  from MEDIA_PLL, MEM_PLL is relocked and the PHY clock moved back. Each move
  makes the clock unit pause the controller, which then switches to the other
  of its two timing parameter sets. The memory frequency follows the CPU
  frequency through the required-opps of the CPU OPP tables.

properties:
  compatible:
    const: samsung,exynos7870-dmc

  reg:
    items:
      - description: DREX controller registers
      - description: DREX performance filter registers
      - description: DREX PHY registers
      - description: Clock unit pause control registers of CMU_MIF

  reg-names:
    items:
      - const: drex
      - const: pf
      - const: phy
      - const: pause

  clocks:
    items:
      - description: MEM_PLL output
      - description: MEM_PLL divided by two
      - description: BUS_PLL output
      - description: BUS_PLL divided by two
      - description: MEDIA_PLL divided by two
      - description: PHY clock mux
      - description: MEM_PLL input of the PHY clock mux
      - description: Switching clock input of the PHY clock mux
      - description: MIF data bus clock mux
      - description: MIF data bus clock divider
      - description: CCI bus clock mux
      - description: CCI bus clock divider

  clock-names:
    items:
      - const: mem_pll
      - const: mem_pll_div2
      - const: bus_pll
      - const: bus_pll_div2
      - const: media_pll_div2
      - const: phy_clk2x
      - const: phy_mem
      - const: phy_switch
      - const: busd_mux
      - const: busd
      - const: cci_mux
      - const: cci

  operating-points-v2: true

  vdd-supply:
    description: Supply of the memory interface.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - operating-points-v2
  - vdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/samsung,exynos7870-cmu.h>

    memory-controller@10400000 {
        compatible = "samsung,exynos7870-dmc";
        reg = <0x10400000 0x1000>, <0x10410000 0x100>,
              <0x10440000 0x1000>, <0x10461000 0x10>;
        reg-names = "drex", "pf", "phy", "pause";
        clocks = <&cmu_mif CLK_FOUT_MIF_MEM_PLL>,
                 <&cmu_mif CLK_FFAC_MIF_MUX_MEM_PLL_DIV2>,
                 <&cmu_mif CLK_GOUT_MIF_MUX_BUS_PLL>,
                 <&cmu_mif CLK_FFAC_MIF_MUX_BUS_PLL_DIV2>,
                 <&cmu_mif CLK_FFAC_MIF_MUX_MEDIA_PLL_DIV2>,
                 <&cmu_mif CLK_MOUT_MIF_PHY_CLK2X>,
                 <&cmu_mif CLK_GOUT_MIF_MUX_MEM_PLL>,
                 <&cmu_mif CLK_GOUT_MIF_MUX_PHY_SWITCH>,
                 <&cmu_mif CLK_MOUT_MIF_BUSD>,
                 <&cmu_mif CLK_DOUT_MIF_BUSD>,
                 <&cmu_mif CLK_MOUT_MIF_CCI>,
                 <&cmu_mif CLK_DOUT_MIF_CCI>;
        clock-names = "mem_pll", "mem_pll_div2", "bus_pll", "bus_pll_div2",
                      "media_pll_div2", "phy_clk2x", "phy_mem", "phy_switch",
                      "busd_mux", "busd", "cci_mux", "cci";
        operating-points-v2 = <&dmc_opp_table>;
        vdd-supply = <&vdd_buck2>;
    };
